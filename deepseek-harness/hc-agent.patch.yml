# 把配网承载力智能体（hc_agent）挂到 DSH 底座上。
#
# 用法：
#   node apps/cli/lib/bin.js --profile web --patch <本文件> --dump-config
#   node apps/cli/lib/bin.js --profile web --patch <本文件> --help
#
# 说明：
#   * insert 无 id → 追加到 profile 顶层条目列表末尾；
#   * name 用**相对路径**（相对本 patch 文件所在目录），
#     这样不用把它发布到 npm、也不用改任何 package.json 就能加载；
#   * 插件需要两个环境变量：HC_PYTHON（解释器）、HC_PROJECT（hc_agent 工程根）。
- insert:
    - id: tool-hc-agent
      name: "./packages/tool/tool-hc-agent/lib/index.js"
